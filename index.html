<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="inicio.css">
    <link rel="icon" href="assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>Punching The Wood!</title>
    <audio id="bgm" loop preload="auto">
        <source src="assets/musics/5-friday-theme.mp3" type="audio/mpeg">
    </audio>
</head>
<body>
    <main id="main-content">
        <div id="titulo">
            <h1>Punching The Wood!</h1>
        </div>

        <div class="container">
            <button id="playButton">Play</button>
            <button id="botaoCriar" disabled>Create Account</button>
            <button id="botaoEntrar" disabled>Log in Account</button>
            <button id="botaoInformacoes" disabled>Informações</button>
        </div>
        <div class="entrando">
            <input disabled type="text" id="UsuarioEntrar" name="Usuario" placeholder="User name/User email">
            <input disabled type="text" id="SenhaEntrar" name="Usuario" placeholder="password">
            <button id="entrar" disabled>Log in</button>
        </div>
        <div class="criando">
            <input disabled type="text" id="UsuarioCriar" name="Usuario" placeholder="User name/User email">
            <input disabled type="text" id="SenhaCriar" name="Usuario" placeholder="password">
            <button id="criar" disabled>Create</button>
        </div>
        <div class="informacoes">
            <h2>INFORMAÇÕES</h2>
            <h3>COMO JOGAR</h3>
            <p>Coloque aqui as instruções e regras do Punching The Wood!</p>
            <h3>CRIADORES</h3>
            <p>Coloque aqui os nomes dos criadores do jogo.</p>
            
        </div>
        <button id="botaoVoltar">←</button>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
    <script src="inicio.js"></script>
</body>
</html>
