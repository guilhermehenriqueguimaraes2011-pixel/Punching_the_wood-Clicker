
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punching The Wood!</title>
    <link rel="stylesheet" href="jogo.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <audio id="bgm" loop preload="auto">
        <source src="assets/musics/5-friday-theme.mp3" type="audio/mpeg">
    </audio>
</head>
<body>
    <div class="fundo">
        <header class="cabecalho">
            <h1 class="titulo">Punching The Wood!</h1>

            <nav class="botoes-superiores">
                <button id="configuracoes">Configurações</button>
                <button id="ranking">Ranking Global</button>
            </nav>
        </header>
        <div class="container-principal">
            <aside class="menu-lateral">
                <button id="melhoriaClique">Melhoria de Clique</button>
                <button id="melhoriaSegundo">Melhoria de Clique por Segundo</button>
                <button id="loja">Loja</button>
            </aside>

            <main class="area-jogo">
                <div class="contador">
                    <p>Cliques: <span id="contadorCliques">0</span> </p>
                </div>
                <div class="personagem">
                    <img src="assets/sprites/Default/JerryIdle.gif" alt="Jerry">
                </div>
            </main>
        </div>
    </div>
    <script src= "jogo.js"></script>
</body>
</html>
