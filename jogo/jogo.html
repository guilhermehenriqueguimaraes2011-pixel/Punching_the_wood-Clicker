
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punching The Wood!</title>
    <link rel="stylesheet" href="jogo.css">
    <link rel="icon" href="assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <audio id="bgm" loop preload="auto">
        <source src="assets/musics/Clicker_Default_Variant.mp3" type="audio/mpeg">
    </audio>
</head>
<body>
    <div class="FOV">
        <div class="fundo">
            <header class="cabecalho">
                <h1 class="titulo">Punching The Wood!</h1>

                <nav class="botoes-superiores">
                    <button id="configuracoes" type="button">Configurações</button>
                    <button id="ranking" type="button">Ranking Global</button>
                </nav>
            </header>

            <div class="container-principal">
                <aside class="menu-lateral">
                    <button id="melhoriaClique" type="button">Melhoria de Clique</button>
                    <div id="caixa-melhoria" class="caixaa escondido">
                        <p><strong>Melhoria</strong></p>
                        <p>+1 por clique</p>
                        <button type="button" onclick="comprarMelhoria()">Comprar (150 Cliques)</button>
                    </div>
                    <button id="melhoriaSegundo" type="button">Melhoria de Clique por Segundo</button>
                     <div id="caixa-melhoria-por-segundo" class="caixaa escondido">
                        <p><strong>Melhoria por segundo</strong></p>
                        <p>+1 por clique</p>
                        <button type="button" onclick="comprarMelhoria()">Comprar (150 Cliques)</button>
                    </div>
                    <button id="loja" type="button">Loja</button>
                </aside>

                <main class="area-jogo">
                    <div class="contador">
                        <p><span id="contadorCliques">0</span></p>
                    </div>
                    <div id="promptInicio" class="prompt-inicio" role="status">Clique no Jerry para Começar</div>
                    <div class="personagem">
                        <img id="personagem" src="assets/sprites/Default/JerryIdle.gif" alt="Jerry">
                    </div>
                    <div class="madeira" aria-label="Madeira">
                        <img id="madeira" src="assets/sprites/Default/default_wood_idle.png" alt="Toco de madeira">
                        <div class="particulas" aria-hidden="true"></div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <div class="loja" id="lojaPainel">
        <div class="loja-janela">
            <div class="loja-topo">
                <h2>Loja</h2>
                <button id="fecharLoja" type="button">✕</button>
            </div>
            <div class="loja-itens">
                <div class="loja-item"><span>Tema padrão</span><button type="button" data-theme="default">Usar tema</button></div>
                <div class="loja-item"><span>Tema Sonic — 50 cliques</span><button type="button" data-theme="sonic">Comprar</button></div>
                <div class="loja-item"><span>Tema Mario — 50 cliques</span><button type="button" data-theme="mario">Comprar</button></div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
    <script src="jogo.js"></script>
</body>
</html>
